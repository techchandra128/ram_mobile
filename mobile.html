<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <title>RAM</title>
    <link rel="manifest" href="mobile_manifest.json">
    <link rel="stylesheet" href="mobile_core.css">
    <link rel="stylesheet" href="mobile_library.css">
    <link rel="stylesheet" href="mobile_smartdesk.css">
    <link rel="stylesheet" href="mobile_dashboard.css">
    <link rel="stylesheet" href="mobile_diary.css">
</head>
<body data-theme="dark">

    <!-- TOP BAR -->
    <div class="m-topbar">
        <button class="m-back-btn" id="mBackBtn" style="display:none">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"/>
            </svg>
        </button>
        <div class="m-topbar-title" id="mTopbarTitle">RAM</div>
        <div class="m-topbar-actions">
            <button class="m-icon-btn m-lib-ctrl" id="mLibSortBtn" title="Sort" style="display:none">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="15" y2="12"/><line x1="3" y1="18" x2="9" y2="18"/>
                </svg>
            </button>
            <button class="m-icon-btn m-lib-ctrl" id="mLibViewBtn" title="Toggle view" style="display:none">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="mLibViewIcon">
                    <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
                </svg>
            </button>
            <button class="m-icon-btn" id="mSyncBtn" title="Sync">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="23 4 23 10 17 10"/>
                    <polyline points="1 20 1 14 7 14"/>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                </svg>
            </button>
            <button class="m-icon-btn" id="mThemeBtn" title="Toggle Theme">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="mThemeIcon">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- SYNC STATUS BAR -->
    <div class="m-sync-bar" id="mSyncBar" style="display:none">
        <span id="mSyncMsg">Syncing...</span>
    </div>

    <!-- MAIN CONTENT AREA -->
    <div class="m-content" id="mContent">

        <!-- ========== PAGE: MY LIBRARY ========== -->
        <div class="m-page active" id="pagLibrary">

            <!-- SCREEN: ROOT (folders + files) -->
            <div class="m-screen active" id="screenLibraryRoot">
                <div class="m-list" id="mLibraryList">
                    <div class="m-empty">Loading...</div>
                </div>
            </div>

            <!-- SCREEN: INSIDE FOLDER -->
            <div class="m-screen" id="screenLibraryFolder">
                <div class="m-list" id="mFolderFileList"></div>
            </div>

            <!-- SCREEN: SECTION LIST -->
            <div class="m-screen" id="screenSections">
                <div class="m-section-toolbar">
                    <select class="m-sort-select" id="mSortSelect">
                        <option value="default">Sort: Default</option>
                        <option value="alpha-asc">A &rarr; Z</option>
                        <option value="alpha-desc">Z &rarr; A</option>
                        <option value="studied-first">Studied First</option>
                        <option value="unstudied-first">Unstudied First</option>
                        <option value="completed-first">Completed First</option>
                        <option value="incomplete-first">Incomplete First</option>
                        <option value="proficiency-high">Proficiency High &darr;</option>
                        <option value="proficiency-low">Proficiency Low &uarr;</option>
                    </select>
                </div>
                <div class="m-list" id="mSectionList"></div>
            </div>

            <!-- SCREEN: SECTION DETAIL -->
            <div class="m-screen" id="screenDetail">
                <div class="m-tab-bar" id="mTabBar">
                    <button class="m-tab active" data-tab="notes">Notes</button>
                    <button class="m-tab" data-tab="c5">Progress</button>
                    <button class="m-tab" data-tab="c4">Tasks</button>
                </div>
                <div class="m-tab-content" id="mTabContent"></div>
            </div>

        </div>

        <!-- ========== PAGE: SMART DESK ========== -->
        <div class="m-page" id="pagSmartDesk">

            <!-- SCREEN: FILE LIST (flat, no folders) -->
            <div class="m-screen active" id="screenSDFiles">
                <div class="m-list" id="mSDFileList">
                    <div class="m-empty">Loading...</div>
                </div>
            </div>

            <!-- SCREEN: SECTION LIST -->
            <div class="m-screen" id="screenSDSections">
                <div class="m-section-toolbar">
                    <select class="m-sort-select" id="mSDSortSelect">
                        <option value="default">Sort: Default</option>
                        <option value="alpha-asc">A &rarr; Z</option>
                        <option value="alpha-desc">Z &rarr; A</option>
                        <option value="studied-first">Studied First</option>
                        <option value="unstudied-first">Unstudied First</option>
                        <option value="completed-first">Completed First</option>
                        <option value="incomplete-first">Incomplete First</option>
                        <option value="proficiency-high">Proficiency High &darr;</option>
                        <option value="proficiency-low">Proficiency Low &uarr;</option>
                    </select>
                </div>
                <div class="m-list" id="mSDSectionList"></div>
            </div>

            <!-- SCREEN: SECTION DETAIL (Smart Desk) -->
            <div class="m-screen" id="screenSDDetail">
                <div class="m-tab-bar" id="mSDTabBar">
                    <button class="m-tab active" data-tab="notes">Notes</button>
                    <button class="m-tab" data-tab="c5">Progress</button>
                    <button class="m-tab" data-tab="c4">Tasks</button>
                </div>
                <div class="m-tab-content" id="mSDTabContent"></div>
            </div>

        </div>

        <!-- ========== PAGE: DIARY ========== -->
        <div class="m-page" id="pagDiary">
            <div class="m-diary-coming-soon">
                <div class="m-diary-icon">📔</div>
                <div class="m-diary-title">Diary</div>
                <div class="m-diary-subtitle">Coming Soon</div>
                <div class="m-diary-desc">Your personal diary space is being built. It will bring the full web diary experience to mobile.</div>
            </div>
        </div>

        <!-- ========== PAGE: DASHBOARD ========== -->
        <div class="m-page" id="pagDashboard">
            <div class="m-dash-tabs">
                <button class="m-dash-tab active" data-dash="heatmap">Heatmap</button>
                <button class="m-dash-tab" data-dash="graphs">Graphs</button>
            </div>
            <div class="m-dash-content" id="mDashContent"></div>
        </div>

    </div>

    <!-- BOTTOM NAV -->
    <nav class="m-bottom-nav">
        <button class="m-nav-btn active" data-page="Library" id="navBtnLibrary">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
            </svg>
            <span>Library</span>
        </button>
        <button class="m-nav-btn" data-page="SmartDesk" id="navBtnSmartDesk">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="3" width="20" height="14" rx="2"/>
                <path d="M8 21h8M12 17v4"/>
            </svg>
            <span>Smart Desk</span>
        </button>
        <button class="m-nav-btn" data-page="Diary" id="navBtnDiary">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
                <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
            </svg>
            <span>Diary</span>
        </button>
        <button class="m-nav-btn" data-page="Dashboard" id="navBtnDashboard">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="20" x2="18" y2="10"/>
                <line x1="12" y1="20" x2="12" y2="4"/>
                <line x1="6" y1="20" x2="6" y2="14"/>
            </svg>
            <span>Dashboard</span>
        </button>
    </nav>

    <!-- LOADING OVERLAY -->
    <div class="m-loading" id="mLoading">
        <div class="m-spinner"></div>
        <div class="m-loading-text">Loading RAM...</div>
    </div>

    <!-- LIB SORT SHEET -->
    <div class="m-sort-sheet" id="mLibSortSheet">
        <div class="m-sort-backdrop"></div>
        <div class="m-sort-sheet-inner">
            <div class="m-sort-sheet-title">Sort By</div>
            <button class="m-sort-option" data-sort="name-asc">Name A → Z</button>
            <button class="m-sort-option" data-sort="name-desc">Name Z → A</button>
            <button class="m-sort-option" data-sort="progress-desc">Progress High → Low</button>
            <button class="m-sort-option" data-sort="progress-asc">Progress Low → High</button>
        </div>
    </div>

    <script src="mobile_core.js"></script>
    <script src="mobile_library.js"></script>
    <script src="mobile_smartdesk.js"></script>
    <script src="mobile_dashboard.js"></script>
    <script src="mobile_diary.js"></script>
</body>
</html>
