<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <title>RAM</title>
    <link rel="manifest" href="mobile_manifest.json">
    <link rel="stylesheet" href="mobile.css">
</head>
<body data-theme="dark">

    <!-- TOP BAR -->
    <div class="m-topbar">
        <button class="m-back-btn" id="mBackBtn" style="display:none">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"/>
            </svg>
        </button>
        <div class="m-topbar-title" id="mTopbarTitle">RAM</div>
        <div class="m-topbar-actions">
            <button class="m-icon-btn" id="mSyncBtn" title="Sync">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="23 4 23 10 17 10"/>
                    <polyline points="1 20 1 14 7 14"/>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                </svg>
            </button>
            <button class="m-icon-btn" id="mThemeBtn" title="Toggle Theme">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="mThemeIcon">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- SYNC STATUS BAR -->
    <div class="m-sync-bar" id="mSyncBar" style="display:none">
        <span id="mSyncMsg">Syncing...</span>
    </div>

    <!-- MAIN CONTENT -->
    <div class="m-content" id="mContent">

        <!-- SCREEN: FILE LIST -->
        <div class="m-screen active" id="screenFiles">
            <div class="m-list" id="mFileList">
                <div class="m-empty">Loading...</div>
            </div>
        </div>

        <!-- SCREEN: SECTION LIST -->
        <div class="m-screen" id="screenSections">
            <div class="m-list" id="mSectionList"></div>
        </div>

        <!-- SCREEN: SECTION DETAIL -->
        <div class="m-screen" id="screenDetail">
            <!-- TAB BAR -->
            <div class="m-tab-bar" id="mTabBar">
                <button class="m-tab active" data-tab="notes">Notes</button>
                <button class="m-tab" data-tab="c5">Progress</button>
                <button class="m-tab" data-tab="c4">Notes/Tasks</button>
            </div>

            <!-- TAB CONTENT -->
            <div class="m-tab-content" id="mTabContent"></div>
        </div>

    </div>

    <!-- LOADING OVERLAY -->
    <div class="m-loading" id="mLoading">
        <div class="m-spinner"></div>
        <div class="m-loading-text">Loading RAM...</div>
    </div>

    <script src="mobile.js"></script>

    <!-- DEBUG PANEL -->
    <div id="debugPanel" style="display:none;position:fixed;bottom:0;left:0;right:0;height:40vh;background:#000;color:#0f0;font-size:11px;font-family:monospace;overflow-y:auto;z-index:9999;padding:8px;border-top:2px solid #0f0;">
        <div style="display:flex;justify-content:space-between;margin-bottom:4px;">
            <span style="color:#fff;font-weight:bold;">DEBUG LOG</span>
            <button onclick="document.getElementById('debugPanel').style.display='none'" style="background:#f00;color:#fff;border:none;padding:2px 8px;border-radius:4px;">X</button>
        </div>
        <div id="debugLog"></div>
    </div>
    <button onclick="document.getElementById('debugPanel').style.display='block'" style="position:fixed;bottom:10px;right:10px;z-index:9998;background:#333;color:#fff;border:none;padding:6px 10px;border-radius:6px;font-size:11px;">DEBUG</button>

    <script>
        const _log = console.log.bind(console);
        const _warn = console.warn.bind(console);
        const _error = console.error.bind(console);
        function appendDebug(type, args) {
            const el = document.getElementById('debugLog');
            if (!el) return;
            const line = document.createElement('div');
            line.style.color = type === 'error' ? '#f66' : type === 'warn' ? '#ff0' : '#0f0';
            line.style.borderBottom = '1px solid #222';
            line.style.padding = '2px 0';
            line.textContent = `[${type}] ${Array.from(args).map(a => typeof a === 'object' ? JSON.stringify(a) : a).join(' ')}`;
            el.appendChild(line);
            el.scrollTop = el.scrollHeight;
        }
        console.log = (...args) => { _log(...args); appendDebug('log', args); };
        console.warn = (...args) => { _warn(...args); appendDebug('warn', args); };
        console.error = (...args) => { _error(...args); appendDebug('error', args); };
        window.onerror = (msg, src, line) => { appendDebug('error', [`${msg} (line ${line})`]); };
    </script>
</body>
</html>
