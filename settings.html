<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="settings.css">
</head>
<body>

<div class="settings-top-bar">
    <span class="settings-title">Settings</span>
</div>

<div class="settings-content">

    <div class="settings-section">
        <div class="settings-section-title">Select Homepage</div>
        <div class="settings-options" id="homepageOptions">
            <label class="settings-option">
                <input type="radio" name="homepage" value="dashboard">
                <span class="settings-option-label">Dashboard</span>
            </label>
            <label class="settings-option">
                <input type="radio" name="homepage" value="smartdesk">
                <span class="settings-option-label">Smart Desk</span>
            </label>
            <label class="settings-option">
                <input type="radio" name="homepage" value="diary">
                <span class="settings-option-label">Diary</span>
            </label>
            <label class="settings-option">
                <input type="radio" name="homepage" value="library">
                <span class="settings-option-label">My Library</span>
            </label>
            <label class="settings-option">
                <input type="radio" name="homepage" value="allsections">
                <span class="settings-option-label">All Sections</span>
            </label>
            <label class="settings-option">
                <input type="radio" name="homepage" value="playlists">
                <span class="settings-option-label">Playlists</span>
            </label>
            <label class="settings-option">
                <input type="radio" name="homepage" value="allfiles">
                <span class="settings-option-label">All Files</span>
            </label>
            <label class="settings-option">
                <input type="radio" name="homepage" value="campaign">
                <span class="settings-option-label">Campaigns</span>
            </label>
        </div>
    </div>

</div>

<script src="settings.js"></script>
</body>
</html>
